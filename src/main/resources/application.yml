spring:
  application:
    name: finledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finledger}
    username: ${DB_USERNAME:finledger}
    password: ${DB_PASSWORD:finledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
